[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshackle"
version = "1.0.0"
description = "A lightweight, framework-agnostic runtime circuit breaker for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [
    { name = "Dante Bullock", email = "docspoc101@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0.0",
    "httpx>=0.24.0",
]
integration = [
    # Pinned 2026-10-21: litellm >=1.106 imports CacheableResult from mcp.types
    # (mcp 2.x only) in its proxy MCP catalog, while crewai pins mcp to the 1.x
    # line (mcp~=1.28.1) - the two cannot coexist and the crewAI-over-litellm
    # coverage test dies on the import. 1.102.1 is the last litellm verified
    # clean against mcp 1.x (whole wheel checked: zero CacheableResult
    # references; it is also the version the green 2026-09-24 CI run used).
    # Revisit when crewai supports mcp 2.x.
    "litellm==1.102.1",
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "crewai>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/Fame510/SHACKLE"
Repository = "https://github.com/Fame510/SHACKLE"
"Bug Reports" = "https://github.com/Fame510/SHACKLE/issues"
"Commercial Licensing" = "https://github.com/Fame510/SHACKLE/blob/main/README.md#-author--license"

[tool.setuptools.packages.find]
where = ["."]
include = ["shackle*"]

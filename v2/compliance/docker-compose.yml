version: '3.8'

services:
  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shackle-license-server
    ports:
      - "8000:8000"
    environment:
      # Legacy alias, still honored by the server.
      - MASTER_SECRET=${MASTER_SECRET}
      # Licensing trust configuration. Without SHACKLE_LICENSE_PUBKEYS the
      # server boots FAIL-CLOSED and rejects every license by design.
      - SHACKLE_MASTER_SECRET=${SHACKLE_MASTER_SECRET}
      - SHACKLE_LICENSE_PUBKEYS=${SHACKLE_LICENSE_PUBKEYS}
      - SHACKLE_LICENSE_PRIVATE_KEY=${SHACKLE_LICENSE_PRIVATE_KEY}
      - SHACKLE_LICENSE_SIGNING_KEY_ID=${SHACKLE_LICENSE_SIGNING_KEY_ID}
      - DATABASE_PATH=/data/licenses.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs:/var/log/shackle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    container_name: shackle-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: shackle-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: shackle-network
